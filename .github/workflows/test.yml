name: Offline regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node test/week.mjs
      - run: python test/build_html.py
      - run: python tools/build_demo.py
      - run: git diff --exit-code -- docs/schedule-demo.html
      - run: npm install --prefix "$RUNNER_TEMP/browser" --no-package-lock playwright@1.64.0
      - run: '"$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: node test/ui.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
