<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">厦大课表示例预览</title>
  <desc id="desc">脱敏的课表 HTML 页面示例，展示今日课程、周次切换和周课表网格。</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a315b"/><stop offset="0.58" stop-color="#10528b"/><stop offset="1" stop-color="#1876ad"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eef4f9"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1b375a" flood-opacity=".12"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b375a" flood-opacity=".08"/></filter>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:Georgia,"Songti SC","STSong",serif}.muted{fill:#718096}.ink{fill:#182334}.small{font-size:18px}.tiny{font-size:15px}
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <g transform="translate(100 72)">
    <rect width="1400" height="250" rx="30" fill="url(#hero)" filter="url(#shadow)"/>
    <circle cx="1300" cy="-16" r="150" fill="none" stroke="#fff" stroke-opacity=".13"/>
    <circle cx="1200" cy="264" r="105" fill="none" stroke="#fff" stroke-opacity=".13"/>
    <text x="38" y="48" class="sans" font-size="15" font-weight="700" letter-spacing="3" fill="#a9d6f5">MY WEEKLY SCHEDULE</text>
    <text x="38" y="112" class="serif" font-size="52" font-weight="700" fill="#fff">我的课表</text>
    <text x="38" y="153" class="sans" font-size="20" font-weight="600" fill="#d7e8f5">示例同学</text>
    <g transform="translate(1090 43)">
      <rect width="260" height="150" rx="20" fill="#fff" fill-opacity=".11" stroke="#fff" stroke-opacity=".25"/>
      <text x="25" y="36" class="sans" font-size="15" fill="#d5e5f2">当前查看</text>
      <text x="25" y="82" class="sans" font-size="34" font-weight="700" fill="#fff">第 3 周</text>
      <text x="25" y="115" class="sans" font-size="16" fill="#d5e5f2">2026 年 9 月 14 日 - 20 日</text>
    </g>
  </g>

  <g transform="translate(100 350)">
    <rect width="1400" height="82" rx="18" fill="#fff" fill-opacity=".92" stroke="#e0e7ef" filter="url(#soft)"/>
    <text x="30" y="31" class="sans" font-size="13" font-weight="800" letter-spacing="2" fill="#1769aa">WEEK VIEW</text>
    <text x="30" y="59" class="sans ink" font-size="20" font-weight="700">浏览课表</text>
    <g transform="translate(530 20)"><rect width="280" height="44" rx="13" fill="#edf2f7"/>
      <rect x="7" y="5" width="42" height="34" rx="9" fill="none"/><text x="20" y="30" class="sans" font-size="25" fill="#526176">←</text>
      <rect x="57" y="5" width="166" height="34" rx="9" fill="#fff" stroke="#e4eaf1"/><text x="82" y="29" class="sans" font-size="16" font-weight="700" fill="#182334">第 3 周</text><text x="196" y="29" class="sans" font-size="15" fill="#718096">⌄</text>
      <text x="242" y="30" class="sans" font-size="25" fill="#526176">→</text>
    </g>
    <g transform="translate(1140 22)"><rect width="38" height="22" rx="11" fill="#1769aa"/><circle cx="27" cy="33" r="8" fill="#fff"/><text x="50" y="18" class="sans" font-size="16" fill="#536176">仅显示今天</text></g>
  </g>

  <g transform="translate(100 460)">
    <rect width="1400" height="230" rx="22" fill="#fff" stroke="#e0e7ef" filter="url(#soft)"/>
    <text x="28" y="40" class="sans" font-size="13" font-weight="800" letter-spacing="2" fill="#1769aa">TODAY</text>
    <text x="28" y="70" class="sans" font-size="23" font-weight="700" fill="#182334">今日课程</text>
    <rect x="1245" y="28" width="120" height="34" rx="17" fill="#f3f6f9" stroke="#e4eaf1"/><text x="1265" y="50" class="sans" font-size="14" fill="#5f6d7f">9 月 16 日 周三</text>
    <g transform="translate(28 94)">
      <rect width="1344" height="58" rx="14" fill="#f8fafc" stroke="#e4eaf1"/><rect width="5" height="58" rx="2" fill="#3977c3"/>
      <text x="24" y="24" class="sans" font-size="15" fill="#718096">第 5-6 节</text><text x="24" y="45" class="sans" font-size="18" font-weight="700" fill="#182334">数据结构与算法</text><text x="330" y="25" class="sans" font-size="15" fill="#718096">示例班 · 陈老师 · 嘉庚楼 101</text>
    </g>
    <g transform="translate(28 162)">
      <rect width="1344" height="58" rx="14" fill="#f8fafc" stroke="#e4eaf1"/><rect width="5" height="58" rx="2" fill="#3b9276"/>
      <text x="24" y="24" class="sans" font-size="15" fill="#718096">第 9-10 节</text><text x="24" y="45" class="sans" font-size="18" font-weight="700" fill="#182334">人工智能导论</text><text x="330" y="25" class="sans" font-size="15" fill="#718096">示例班 · 林老师 · 海韵 203</text>
    </g>
  </g>

  <g transform="translate(100 720)">
    <rect width="1400" height="330" rx="22" fill="#fff" stroke="#e0e7ef" filter="url(#soft)"/>
    <text x="28" y="42" class="sans" font-size="13" font-weight="800" letter-spacing="2" fill="#1769aa">WEEKLY OVERVIEW</text>
    <text x="28" y="73" class="sans" font-size="23" font-weight="700" fill="#182334">本周课表</text>
    <g transform="translate(28 92)">
      <rect width="1344" height="210" rx="15" fill="#fff" stroke="#e4eaf1"/>
      <rect width="1344" height="48" rx="15" fill="#f6f8fb"/>
      <line x1="112" y1="0" x2="112" y2="210" stroke="#e4eaf1"/>
      <g class="sans" font-size="15" font-weight="700" fill="#455368" text-anchor="middle"><text x="190" y="30">周一</text><text x="366" y="30">周二</text><text x="542" y="30">周三</text><text x="718" y="30">周四</text><text x="894" y="30">周五</text><text x="1070" y="30">周六</text><text x="1246" y="30">周日</text></g>
      <g stroke="#e4eaf1"><line x1="0" y1="96" x2="1344" y2="96"/><line x1="0" y1="144" x2="1344" y2="144"/><line x1="0" y1="192" x2="1344" y2="192"/><line x1="288" y1="0" x2="288" y2="210"/><line x1="464" y1="0" x2="464" y2="210"/><line x1="640" y1="0" x2="640" y2="210"/><line x1="816" y1="0" x2="816" y2="210"/><line x1="992" y1="0" x2="992" y2="210"/><line x1="1168" y1="0" x2="1168" y2="210"/></g>
      <g class="sans tiny" text-anchor="middle" fill="#718096"><text x="56" y="79">第 1-2 节</text><text x="56" y="127">第 3-4 节</text><text x="56" y="175">第 5-6 节</text><text x="56" y="223">第 7-8 节</text></g>
      <g class="sans" font-size="14" font-weight="700"><rect x="126" y="53" width="150" height="37" rx="7" fill="#edf4fc" stroke="#d5e5f6"/><text x="141" y="76" fill="#245489">计算机网络</text><rect x="478" y="101" width="150" height="37" rx="7" fill="#edf8f4" stroke="#d3ede4"/><text x="493" y="124" fill="#286b56">数据结构与算法</text><rect x="654" y="149" width="150" height="37" rx="7" fill="#fff5ea" stroke="#f4dfc7"/><text x="669" y="172" fill="#92531f">人工智能导论</text><rect x="830" y="197" width="150" height="37" rx="7" fill="#f6f0fb" stroke="#e6d8f2"/><text x="845" y="220" fill="#66438f">大学英语</text></g>
    </g>
  </g>
</svg>
